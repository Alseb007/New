name: Inputs demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose the environment to deploy"
        required: true
        default: "dev"
        options:
          - dev
          - prod
          - test

      artifact_tag:
        description: Choose the git tag to deploy
        required: true
        default: V2.1.1.1
       

jobs:
  input-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy the app
        run: echo "Deploying ${{ inputs.artifact_tag }}This is done to ${{ inputs.environment }}"
