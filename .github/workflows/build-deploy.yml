name: pull request
on:
  push: 
    branches: 
      - main
      - develop1
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: build step
        run: echo "Building the app"
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: build step
        run: echo "deploy the step"
