name: enviornment
on: 
  workflow_dispatch: 
    inputs:
      enviornment:
        description: chose the enviornment to display
        required: true
        type: choice
        options:
          - dev
          - prod
          - test
        default: test
      tag:
       description: choose the tag to deploy
       required: true
jobs:
  inputs-demo:
    runs-on: ubuntu-latest
    steps:
      - name: shit
        run: echo "Deploy the ${{ inputs.tag}} application to ${{ inputs.enviornment }}"
